[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sba"
version = "0.1.0"
description = "Simulate Before You Act: a simulation gate for agent writes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ahmed Salama" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gradio>=6,<7",
  "pydantic>=2.7",
  "httpx>=0.27",
  "openai>=1.40",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sba = ["ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
